model: tencent/Hy4-preview
label:
  en_US: Hy4 preview
  zh_Hans: Hy4 preview
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 1048576
    default: 4096
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: presence_penalty
    use_template: presence_penalty
  - name: response_format
    use_template: response_format
pricing:
  input: '0.834'
  output: '2.501'
  unit: '0.000001'
  currency: USD
