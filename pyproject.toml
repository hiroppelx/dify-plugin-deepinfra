dependencies = [
    "dify_plugin>=0.9.0,<0.11.0",
    "openai>=1.61.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "tiktoken>=0.8.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]
